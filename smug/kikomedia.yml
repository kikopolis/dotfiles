session: kikomedia

root: ~/git/kikopolis-media

before_start:
  - ./vendor/bin/sail up -d

stop:
  - ./vendor/bin/sail down

windows:
  - name: shell
    selected: true
    layout: main-vertical
    commands:
      - clear
  - name: automated
    layout: tiled
    commands: 
      - ./vendor/bin/sail npm run dev

